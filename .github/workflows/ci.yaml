name: CI Pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete
    
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r test.requirements.txt


      - name: Run tests
        run: |
          python -m pytest -v


  docker-build:

    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: 06-lab-complete

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build -t fastapi-app .